# Yaesu FT-891, connected via a DigiRig DR-891 cable
RIG_MODEL=1036
RIG_NAME="FT-891"
SERIAL_DEVICE="/dev/serial/by-id/usb-Silicon_Labs_CP2105_Dual_USB_to_UART_Bridge_Controller_01CD2A41-if00-port0"
# This cable (Yaesu DR-891) uses a CP2105 dual-UART chip, distinct from the
# CP2102N used by the plain DigiRig Mobile (e.g. the TX-500 MP's cable) -
# if00 is the CAT port; if01 is unused here. Confirmed live: rigctld read
# real frequency/mode (7.190 MHz, PKTUSB 3000) over this exact port/baud.
# Set MENU 05-06 (CAT RATE) on the radio to match - this MUST agree with
# whatever the radio's own menu is actually set to.
BAUD_RATE=38400
# PTT via the radio's own CAT command (not RTS/DTR) - matches MENU 05-08
# (CAT RTS) = DISABLE below.
PTT_TYPE="RIG"
# DigiRig's own USB audio codec - find with: aplay -l
AUDIO_DEVICE="hw:1,0"
# PulseAudio device names for WSJT-X/JS8Call - confirmed via:
# pactl list short sources|sinks
PULSE_INPUT="alsa_input.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.mono-fallback"
PULSE_OUTPUT="alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo"
# Same generic C-Media codec name as the TX-500 MP's DigiRig - confirmed via
# VARA HF's own dropdown showing the identical truncated Wine device name.
VARA_INPUT="In: USB Audio Device - USB Audi"
VARA_OUTPUT="Out: USB Audio Device - USB Aud"
# One-time ALSA mixer levels this cable needs on its C-Media audio codec
# (mic gain was live-tuned against VARA HF's input meter; default mic
# capture gain of 100% pegged it into the red) - see radio_profiles/audio/.
AUDIO_SCRIPT="$HOME/radio_profiles/audio/ft891.sh"
FLRIG_NAME="FT-891"
# Radio menu settings to check before operating digital modes (from a
# known-working reference configuration for this exact radio+cable pairing).
NOTES="05-06 CAT RATE = 38400bps
05-07 CAT TOT = 100ms
05-08 CAT RTS = DISABLE
08-01 DATA MODE = OTHERS
08-02 PSK TONE = 1500Hz
08-03 OTHER DISP = 1500Hz
08-04 OTHER SHIFT = 1500Hz
08-05 DATA LCUT FREQ = OFF
08-07 DATA HCUT FREQ = OFF
08-09 DATA IN SELECT = REAR
08-10 DATA PTT SELECT = DAKY
08-11 DATA OUT LEVEL = 50
08-12 DATA BFO = USB
11-07 SSB BFO = AUTO
For digital operation always set Mode = DATA
For digital operation always set WDH = 3000
For digital operation always set mode to USB
Set digital output power via menu 16-03
To set DATA mode: long press [BAND], select DATA with VFO knob
To set WDH: short press [F] repeatedly to FUNCTION-1 screen, use MFK to
  select WDH, short press MFK, rotate to 3000, long press [F] to exit"
