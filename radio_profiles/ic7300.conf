# Icom IC-7300, connected via its own USB port - a Silicon Labs CP2102
# bridge for CAT, separate from its own built-in USB audio codec (unlike
# the IC-705, whose CAT and audio share one composite USB device).
RIG_MODEL=3073
RIG_NAME="IC-7300"
# Must exactly match flrig's own rig name (see ~/.flrig/*.prefs filenames) -
# confirmed present in this flrig build.
FLRIG_NAME="IC-7300"
# Find with: ls /dev/serial/by-id/ - this one's already self-identifying
# (includes "IC-7300" and the radio's own serial number), unlike a generic
# DigiRig-style cable that would report the same path regardless of which
# radio is attached.
SERIAL_DEVICE="/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_IC-7300_02002968-if00-port0"
# Confirmed live: rigctld read real frequency/mode (7.140 MHz, PKTUSB) at
# this rate. 19200 and 9600 were both tried and timed out (wrong baud
# causes a hang, not a clean error) - this radio's own CI-V baud rate menu
# setting must actually match 115200 for this to keep working.
BAUD_RATE=115200
# The IC-7300's own built-in USB audio codec (same Burr-Brown/TI chip as
# the IC-705's). IMPORTANT: identified with the IC-705 physically
# unplugged, since both radios report the *identical* generic USB product
# string ("Burr-Brown from TI USB Audio CODEC") - hw:CODEC,0 only resolves
# to the right one when just one of these two radios is connected at a
# time. Don't trust this value if both are ever plugged in simultaneously;
# re-verify with only this radio connected (aplay -l / pactl list short
# sources|sinks) if that ever changes.
AUDIO_DEVICE="hw:CODEC,0"
PULSE_INPUT="alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo"
PULSE_OUTPUT="alsa_output.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo"
# VARA HF/FM's own device-name format (Wine WinMM naming) - confirmed
# 2026-09-10 two ways: (1) matches verbatim what VARA HF itself persisted
# to ~/.wine32/drive_c/VARA/VARA.ini under [Soundcard] after being pointed
# at this radio's audio device, and (2) VARA HF's own live VU meter showed
# real moving audio input (-41 to -44 dB) with this device selected. Same
# string as the IC-705 profile because both radios share the identical
# Burr-Brown/TI USB codec chip, so Wine enumerates them identically - this
# was expected, not a coincidence.
VARA_INPUT="In: USB Audio CODEC - USB Audio"
VARA_OUTPUT="Out: USB Audio CODEC - USB Audi"
# Default ALSA playback level (82%, -23dB) didn't look obviously
# over-driven - no AUDIO_SCRIPT mixer tuning applied. Live VARA HF input
# meter (RX side) confirmed working at -41 to -44 dB; TX audio drive level
# itself hasn't been confirmed against a real over-the-air signal report,
# same as it wasn't for the other profiles at this stage.
