# Icom IC-705
RIG_MODEL=3085
RIG_NAME="IC-705"
# Must exactly match flrig's own rig name (see ~/.flrig/*.prefs filenames)
FLRIG_NAME="IC-705"
# Find with: ls /dev/serial/by-id/
SERIAL_DEVICE="/dev/serial/by-id/usb-Icom_Inc._IC-705_IC-705_42001628-if00"
# Verified working at this rate (see today's setup).
BAUD_RATE=115200
# Uses the card's stable ID string (see /proc/asound/cards or `aplay -l`,
# the name in brackets after the card number) rather than a raw numeric
# card index, which shifts depending on USB enumeration order across
# reboots/replugs (e.g. a card 1 that used to be this radio can become
# a different device, like the laptop's built-in audio, after a reinstall).
AUDIO_DEVICE="hw:CODEC,0"
# PulseAudio device names for WSJT-X/JS8Call - find with: pactl list short sources|sinks
PULSE_INPUT="alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo"
PULSE_OUTPUT="alsa_output.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo"
# VARA HF/FM's own device-name format (Wine WinMM naming, separate from the
# PulseAudio names above) - find via VARA's own Soundcard setup dropdown.
VARA_INPUT="In: USB Audio CODEC - USB Audio"
VARA_OUTPUT="Out: USB Audio CODEC - USB Audi"
