# Lab599 TX-500 MP, connected via DigiRig Mobile
# Uses Kenwood TS-2000 CAT emulation, not Hamlib's native LAB599_TX500
# backend (model 2050) - confirmed via a known-working reference config.
RIG_MODEL=2014
RIG_NAME="TX-500 MP"
SERIAL_DEVICE="/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX-if00-port0"
# Set MENU 36 (CAT PROTOCOL) on the radio to TS2000 to match. Confirmed
# live: rigctld correctly reads real frequency/mode over this port at this
# baud rate (Kenwood ID response = ID019, i.e. TS-2000).
BAUD_RATE=9600
PTT_TYPE="RTS"
# Do not enable VOX on the radio - it fights with RTS PTT.
# Must exactly match flrig's own rig name (see ~/.flrig/*.prefs filenames).
# Switched 2026-09-16 from the generic "TS-2000" Kenwood emulation to
# flrig's dedicated native "TX500" (Lab599) driver - confirmed via the
# real prefs file it creates (~/.flrig/TX500.prefs). This requires the
# radio's own MENU 36 (CAT PROTOCOL) to be set to Lab599, not TS2000 -
# see NOTES below. Whichever value is wrong here gets silently
# overwritten back on every launch by Start_Flrig_Radio.sh - this exact
# mismatch already bit this project once tonight (was "TX-500MP", not a
# real driver name) - don't trust this value without checking the real
# file it maps to.
FLRIG_NAME="TX500"
# flrig's "restore mode on connect" feature pushes its own remembered
# mode back to the radio on every connect - confirmed 2026-09-16 this
# silently kicks the TX-500 MP out of DIG into USB every time. See
# Start_Flrig_Radio.sh for the actual force-off fix (a one-time prefs
# edit doesn't hold - flrig resets it on its own on exit).
FLRIG_DISABLE_RESTORE_MODE="true"
# See Start_Flrig_Radio.sh - this radio's CAT emulation over 9600 baud
# can't keep up with flrig's default zero-delay polling, causing garbled/
# mismatched CAT traffic that plausibly triggers the DIG->USB mode kick.
FLRIG_SERIAL_WRITE_DELAY_MS="20"
FLRIG_SERIAL_TIMEOUT_MS="250"
# See Start_Flrig_Radio.sh - repeated mode polling itself (not a set
# command) appears to make this radio's firmware drop DIG back to USB.
FLRIG_DISABLE_MODE_POLL="true"
# DigiRig's own USB audio codec. Uses the card's stable ALSA ID string
# ("Device", from /proc/asound/card*/id) instead of a raw numeric index -
# confirmed live 2026-09-16: this card enumerated as card 2, not card 1,
# after a reconnect, which silently misdirected the AUDIO_SCRIPT mixer
# tuning below at a completely unrelated internal audio device and left
# this radio's real mic capture gain maxed out (pegged/clipped VARA HF
# input). Same staleness class as the IC-705/IC-7300's hw:CODEC,0 - see
# those profiles' comments. Don't trust this value if this DigiRig and
# the FT-891's DigiRig cable (same C-Media chipset, likely same "Device"
# ALSA ID) are ever plugged in simultaneously - re-verify with only this
# one connected if that ever happens (cat /proc/asound/card*/id).
AUDIO_DEVICE="hw:Device,0"
# PulseAudio device names for WSJT-X/JS8Call - confirmed via:
# pactl list short sources|sinks
PULSE_INPUT="alsa_input.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.mono-fallback"
PULSE_OUTPUT="alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo"
# Confirmed live in VARA HF's own device dropdown (Wine truncates these to
# ~32 chars, same as every other radio's Wine-facing audio name).
VARA_INPUT="In: USB Audio Device - USB Audi"
VARA_OUTPUT="Out: USB Audio Device - USB Aud"
# One-time ALSA mixer levels this radio needs on its Digirig audio codec
# (mic/speaker gain, disabling onboard AGC) - see radio_profiles/audio/.
AUDIO_SCRIPT="$HOME/radio_profiles/audio/tx500mp.sh"
NOTES="Set MENU 36 CAT PROTOCOL = Lab599 (switched 2026-09-16 from TS2000
  while chasing a DIG->USB mode-reversion bug over flrig - see
  FLRIG_NAME's comment above)
Set MODE = DIGI
Do not enable VOX on radio"
