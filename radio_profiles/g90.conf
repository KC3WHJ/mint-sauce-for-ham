# Xiegu G90, connected via its own built-in USB (CP2102 CAT + C-Media USB
# audio codec) - no DigiRig needed for this one.
# RIG_MODEL/BAUD_RATE/PTT_TYPE match EmComm Tools OS's validated config for
# this exact radio (community & beta releases agree), and were independently
# confirmed here with a real VARA HF connection attempt to KG4OCM.
RIG_MODEL=3088
RIG_NAME="G-90"
SERIAL_DEVICE="/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_c62cf69c8a7ded11b379bb814fc49859-if00-port0"
BAUD_RATE=19200
PTT_TYPE="RTS"
# The G90's own USB audio codec - find with: aplay -l (card number may shift
# depending on what else is plugged in - check before relying on hw:2,0).
AUDIO_DEVICE="hw:2,0"
PULSE_INPUT="alsa_input.usb-C-Media_Electronics_Inc._USB_PnP_Sound_Device-00.mono-fallback"
PULSE_OUTPUT="alsa_output.usb-C-Media_Electronics_Inc._USB_PnP_Sound_Device-00.analog-stereo"
VARA_INPUT="In: USB PnP Sound Device - USB"
VARA_OUTPUT="Out: USB PnP Sound Device - USB"
# WSJT-X/JS8Call/Pat all talk to this radio via rigctld directly (see above)
# and are unaffected by the note below - already proven working live.
#
# flrig's own Xiegu-G90 driver has a known bug (hardcoded CI-V polling
# address 0x88 instead of this radio's real 0x70), which caused repeated
# flrig crashes when patched/tested earlier. VarAC is the only app in this
# setup that needs flrig instead of rigctld, so it's the only one at risk -
# if flrig misbehaves or crashes with this radio, that bug is why.
FLRIG_NAME="Xiegu-G90"
NOTES="AGC = OFF (AGC--)
MODE = U-D (USB-D)
RF-GAIN = 50%
AUX IN = 10
AUX OUT = 13
Set AGC: short press [AGC]
Set Mode: Mode arrow keys on top of head unit
Set RF Gain: long press [AGC], VFO knob to adjust
Set AUX IN: long press [FUNC], Menu 5, VFO to adjust
Set AUX OUT: long press [FUNC], Menu 6, VFO to adjust"
