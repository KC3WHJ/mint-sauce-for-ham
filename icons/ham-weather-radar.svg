<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Weather Radar</title>
  <defs>
    <radialGradient id="scope" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#16364a"/><stop offset="1" stop-color="#0c1d2a"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5cf08a" stop-opacity="0"/><stop offset="1" stop-color="#5cf08a" stop-opacity="0.75"/></linearGradient>
  </defs>
  <circle cx="64" cy="64" r="58" fill="url(#scope)" stroke="#9fb8c8" stroke-width="4"/>
  <g fill="none" stroke="#5f8aa6" stroke-width="1.6">
    <circle cx="64" cy="64" r="19"/><circle cx="64" cy="64" r="38"/><circle cx="64" cy="64" r="56" stroke-opacity="0.0"/>
    <line x1="64" y1="8" x2="64" y2="120"/><line x1="8" y1="64" x2="120" y2="64"/>
  </g>
  <!-- sweep wedge -->
  <path d="M64 64 L64 8 A56 56 0 0 1 112 36 Z" fill="url(#sweep)"/>
  <line x1="64" y1="64" x2="112" y2="36" stroke="#8dffb0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- precipitation cells: green / yellow / red -->
  <g stroke="none">
    <ellipse cx="88" cy="46" rx="15" ry="10" fill="#2fbf5b" opacity="0.9" transform="rotate(-25 88 46)"/>
    <ellipse cx="90" cy="45" rx="8" ry="5.5" fill="#f2d024" transform="rotate(-25 90 45)"/>
    <ellipse cx="91" cy="44" rx="3.5" ry="2.6" fill="#e5483d" transform="rotate(-25 91 44)"/>
    <ellipse cx="42" cy="86" rx="15" ry="9" fill="#2fbf5b" opacity="0.85" transform="rotate(20 42 86)"/>
    <ellipse cx="41" cy="85" rx="6.5" ry="4" fill="#f2d024" transform="rotate(20 41 85)"/>
  </g>
  <circle cx="64" cy="64" r="3.5" fill="#8dffb0"/>
</svg>
