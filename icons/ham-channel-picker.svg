<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Channel Picker</title>
  <!-- panel -->
  <rect x="12" y="10" width="104" height="108" rx="12" fill="#f5f7fa" stroke="#7d8492" stroke-width="3"/>
  <rect x="12" y="10" width="104" height="26" rx="12" fill="#2f3542"/>
  <rect x="12" y="24" width="104" height="12" fill="#2f3542"/>
  <text x="64" y="30" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="14" fill="#7ee6a1">CH  MEM</text>
  <!-- rows: channel chip + name bar -->
  <g>
    <rect x="20" y="44" width="24" height="16" rx="4" fill="#d5dae3"/><rect x="50" y="48" width="56" height="8" rx="4" fill="#c2c8d3"/>
    <rect x="16" y="64" width="96" height="20" rx="6" fill="#3b82c4"/>
    <rect x="20" y="66" width="24" height="16" rx="4" fill="#ffffff"/><rect x="50" y="70" width="56" height="8" rx="4" fill="#dbeafe"/>
    <rect x="20" y="90" width="24" height="16" rx="4" fill="#d5dae3"/><rect x="50" y="94" width="42" height="8" rx="4" fill="#c2c8d3"/>
  </g>
  <!-- channel numbers -->
  <g font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="11" text-anchor="middle">
    <text x="32" y="56" fill="#4b5262">01</text>
    <text x="32" y="78" fill="#3b82c4">02</text>
    <text x="32" y="102" fill="#4b5262">03</text>
  </g>
</svg>
