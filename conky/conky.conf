conky.config = {
    background = false,
    update_interval = 2,
    double_buffer = true,

    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 170,
    own_window_colour = '1a1c23',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    border_inner_margin = 14,
    border_outer_margin = 0,
    minimum_width = 280,

    default_color = 'e6e6e6',
    default_shade_color = '000000',
    draw_shades = false,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=11',
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,
}

conky.text = [[
${font DejaVu Sans:bold:size=13}${color eeeeee}N0CALL ${color 6fa8dc}Station${font}
${color 3a3d4a}${voffset -2}${hr 2}${voffset 4}

${font DejaVu Sans Mono:size=10}${color 8b8f9c}RADIO ${color 3a3d4a}${hr 1}${font}
${font DejaVu Sans Mono:size=11}${color b8bcc8}${execi 10 ~/.local/bin/ham-radio-name.sh}${goto 110}${color 98c379}${execi 2 ~/.local/bin/ham-radio-freq.sh}
${color b8bcc8}Mode${goto 110}${color 98c379}${execi 2 ~/.local/bin/ham-radio-mode.sh}${font}

${font DejaVu Sans Mono:size=10}${color 8b8f9c}APPS ${color 3a3d4a}${hr 1}${font}
${font DejaVu Sans Mono:size=11}${color b8bcc8}JS8Call${goto 110}${if_running js8call}${color 98c379}● Running${else}${color 5c6370}○ Off${endif}
${color b8bcc8}Pat Winlink${goto 110}${if_running pat}${color 98c379}● Running${else}${color 5c6370}○ Off${endif}${font}

${font DejaVu Sans Mono:size=10}${color 8b8f9c}STATION ${color 3a3d4a}${hr 1}${font}
${font DejaVu Sans Mono:size=11}${color b8bcc8}GPS Grid${goto 110}${color 61afef}${execi 10 ~/.local/bin/ham-gps-grid.sh}
${color b8bcc8}CPU Temp${goto 110}${color e5c07b}${execi 5 sensors 'k10temp-*' 'coretemp-*' 2>/dev/null | grep -E 'Tctl|Tdie|^temp1' | head -1 | awk '{print $2}'}${font}

${color 3a3d4a}${hr 1}
${font DejaVu Sans Mono:size=10}${color 8b8f9c}UTC${goto 110}${color e6e6e6}${utime %H:%M}
${color 8b8f9c}Local${goto 110}${color e6e6e6}${time %H:%M}
${color 8b8f9c}Date${goto 110}${color e6e6e6}${time %Y-%m-%d}${font}
]]
